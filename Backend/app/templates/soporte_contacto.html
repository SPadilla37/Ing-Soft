<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo mensaje de soporte</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); padding: 32px; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: bold;">
                                📧 Nuevo Mensaje de Soporte
                            </h1>
                            <p style="margin: 8px 0 0 0; color: rgba(255,255,255,0.9); font-size: 14px;">
                                Ref: {{ reference_id }}
                            </p>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding: 32px;">
                            <!-- Category Badge -->
                            <div style="display: inline-block; background-color: #f3f4f6; padding: 8px 16px; border-radius: 20px; margin-bottom: 24px;">
                                <span style="color: #6366f1; font-weight: 600; font-size: 14px;">{{ category }}</span>
                            </div>
                            
                            <!-- User Info -->
                            <div style="background-color: #f9fafb; border-left: 4px solid #6366f1; padding: 16px; margin-bottom: 24px; border-radius: 8px;">
                                <p style="margin: 0 0 8px 0; color: #6b7280; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                    De:
                                </p>
                                <p style="margin: 0; color: #111827; font-size: 16px; font-weight: 500;">
                                    {{ user_email }}
                                </p>
                            </div>
                            
                            <!-- Subject -->
                            <div style="margin-bottom: 24px;">
                                <p style="margin: 0 0 8px 0; color: #6b7280; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Asunto:
                                </p>
                                <p style="margin: 0; color: #111827; font-size: 18px; font-weight: 600;">
                                    {{ subject }}
                                </p>
                            </div>
                            
                            <!-- Message -->
                            <div style="margin-bottom: 24px;">
                                <p style="margin: 0 0 12px 0; color: #6b7280; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                                    Mensaje:
                                </p>
                                <div style="background-color: #f9fafb; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb;">
                                    <p style="margin: 0; color: #374151; font-size: 15px; line-height: 1.6; white-space: pre-wrap;">{{ message }}</p>
                                </div>
                            </div>
                            
                            <!-- Metadata -->
                            <div style="border-top: 1px solid #e5e7eb; padding-top: 20px; margin-top: 24px;">
                                <p style="margin: 0 0 8px 0; color: #9ca3af; font-size: 12px;">
                                    <strong>IP:</strong> {{ ip_address }}
                                </p>
                                <p style="margin: 0; color: #9ca3af; font-size: 12px;">
                                    <strong>Fecha:</strong> {{ timestamp }}
                                </p>
                            </div>
                            
                            <!-- Action Button -->
                            <div style="text-align: center; margin-top: 32px;">
                                <a href="mailto:{{ user_email }}?subject=Re: {{ subject }}" 
                                   style="display: inline-block; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: 0 4px 6px rgba(99, 102, 241, 0.3);">
                                    Responder al Usuario
                                </a>
                            </div>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f9fafb; padding: 24px; text-align: center; border-top: 1px solid #e5e7eb;">
                            <p style="margin: 0; color: #6b7280; font-size: 13px;">
                                Este mensaje fue enviado desde el formulario de soporte de <strong>Habilio</strong>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
